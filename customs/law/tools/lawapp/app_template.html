<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>관세법 법령 연계뷰</title>
<style>
:root{
  --bg:#f4f6f9;--fg:#18202b;--mut:#667085;--card:#fff;--bd:#d8dde5;--side:#fff;--hl:#fff1a8;--acc:#2457d6;
  --law:#1f4fd8;--dec:#14803c;--rul:#c2410c;--not:#6b7280;
  --law-bg:#e8eefc;--dec-bg:#e3f5ea;--rul-bg:#fdeee3;--not-bg:#eceef1;
  --w-d:#1e293b;--w-c:#7b8798;--w-p:#dc2626;--shadow:0 1px 2px rgba(0,0,0,.06);
  --fs:15px;--hh:52px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#10141a;--fg:#e6e9ee;--mut:#98a2b3;--card:#181e27;--bd:#2c3542;--side:#141a22;--hl:#5b4b00;--acc:#7aa2ff;
  --law:#8fb0ff;--dec:#6fd596;--rul:#ffa66b;--not:#aab2bf;
  --law-bg:#1b2745;--dec-bg:#16301f;--rul-bg:#3a2415;--not-bg:#262c36;
  --w-d:#e2e8f0;--w-c:#7f8aa0;--w-p:#ff6b6b;--shadow:none}}
:root[data-theme=dark]{
  --bg:#10141a;--fg:#e6e9ee;--mut:#98a2b3;--card:#181e27;--bd:#2c3542;--side:#141a22;--hl:#5b4b00;--acc:#7aa2ff;
  --law:#8fb0ff;--dec:#6fd596;--rul:#ffa66b;--not:#aab2bf;
  --law-bg:#1b2745;--dec-bg:#16301f;--rul-bg:#3a2415;--not-bg:#262c36;
  --w-d:#e2e8f0;--w-c:#7f8aa0;--w-p:#ff6b6b;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-size:var(--fs);line-height:1.6;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
#top{position:fixed;top:0;left:0;right:0;height:var(--hh);display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--card);border-bottom:1px solid var(--bd);z-index:50}
#top h1{font-size:16px;margin:0;white-space:nowrap}
#top .sp{flex:1}
.ib{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:5px 10px;font-size:13px;white-space:nowrap}
.ib.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#qwrap{position:relative;flex:1;max-width:460px;min-width:90px}
#q{width:100%;border:1px solid var(--bd);background:var(--bg);color:var(--fg);border-radius:20px;padding:7px 30px 7px 14px;font-size:14px;outline:none}
#q:focus{border-color:var(--acc)}
#qx{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mut);font-size:16px;display:none}
#tabs{display:flex;gap:4px}
#tabs .ib{border-radius:8px}
#app{position:fixed;top:var(--hh);left:0;right:0;bottom:0;display:grid;grid-template-columns:310px 1fr}
#side{background:var(--side);border-right:1px solid var(--bd);overflow:auto;-webkit-overflow-scrolling:touch}
#main{overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
.dtabs{display:flex;position:sticky;top:0;background:var(--side);z-index:2;border-bottom:1px solid var(--bd)}
.dtabs button{flex:1;border:0;background:none;padding:9px 2px;font-size:13px;border-bottom:3px solid transparent;color:var(--mut)}
.dtabs button.on{color:var(--fg);font-weight:700}
.dtabs .c0.on{border-color:var(--law)}.dtabs .c1.on{border-color:var(--dec)}.dtabs .c2.on{border-color:var(--rul)}.dtabs .c3.on{border-color:var(--not)}
.ch-g>summary{list-style:none;cursor:pointer;padding:7px 12px;font-size:12.5px;font-weight:700;background:var(--bg);border-bottom:1px solid var(--bd);color:var(--mut);position:sticky;top:38px}
.ch-g>summary::-webkit-details-marker{display:none}
.ch-g>summary::before{content:"▸ "}.ch-g[open]>summary::before{content:"▾ "}
.row{display:flex;align-items:baseline;gap:6px;padding:6px 12px 6px 18px;border-bottom:1px solid var(--bd);cursor:pointer;font-size:13.5px}
.row:hover{background:var(--bg)}
.row.on{background:var(--hl)}
.row .n{font-weight:700;white-space:nowrap}
.row .t{flex:1;min-width:0}
.row .k{font-size:11px;color:var(--mut);white-space:nowrap}
.row.del{opacity:.5}
.row .rv{color:#e08a00}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:5px;line-height:1.5;white-space:nowrap}
.b0{background:var(--law-bg);color:var(--law)}.b1{background:var(--dec-bg);color:var(--dec)}.b2{background:var(--rul-bg);color:var(--rul)}.b3{background:var(--not-bg);color:var(--not)}
#bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 14px;border-bottom:1px solid var(--bd);background:var(--card);position:sticky;top:0;z-index:20;font-size:12.5px}
#bar .lg{display:inline-flex;align-items:center;gap:4px;cursor:pointer;user-select:none;border:1px solid var(--bd);border-radius:14px;padding:2px 9px 2px 6px}
#bar .lg.off{opacity:.4}
#bar svg{width:34px;height:8px}
#graph{position:relative;padding:14px 16px 60px 24px;min-height:200px}
#graph.cols{display:grid;grid-template-columns:var(--gt);column-gap:104px;align-items:start}
#graph.stack{display:block;padding-left:64px}
#wires{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:0}
.col{display:flex;flex-direction:column;gap:14px;min-width:0;position:relative;z-index:1}
.colh{font-size:12.5px;font-weight:700;color:var(--mut);padding:2px 2px 0;display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px}
#graph.stack .col{margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.card.focus{border:2px solid var(--acc)}
.card .ch{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;padding:8px 10px;border-bottom:1px solid var(--bd);cursor:default}
.card.d0 .ch{background:var(--law-bg)}.card.d1 .ch{background:var(--dec-bg)}.card.d2 .ch{background:var(--rul-bg)}.card.d3 .ch{background:var(--not-bg)}
.card:not(.focus) .ch{cursor:pointer}
.ch .no{font-weight:800}
.ch .ti{font-weight:700;flex:1;min-width:120px}
.ch .meta{font-size:11.5px;color:var(--mut);flex-basis:100%}
.tag{font-size:11px;border:1px solid var(--bd);border-radius:10px;padding:0 7px;color:var(--mut);background:var(--card);white-space:nowrap}
.tag.rv{color:#b45f00;border-color:#e0a050;cursor:pointer}
.path{font-size:11.5px;color:var(--mut);padding:5px 10px 0}
.pb{padding:6px 10px;margin:0;border-left:3px solid transparent;position:relative}
.pb+.pb{border-top:1px dashed var(--bd)}
.pb.hl{background:var(--hl)}
.pb.pin{border-left-color:var(--acc)}
.pb .hang{font-weight:700;margin-right:3px}
.pb .tx{white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.it{display:flex;gap:5px;margin-top:2px;padding-left:1em;white-space:pre-wrap}
.it.l3{padding-left:2.2em}
.it .k{flex:none;color:var(--mut);font-weight:600}
.it .tx{flex:1;min-width:0;word-break:keep-all;overflow-wrap:anywhere}
a.ref{color:var(--acc);text-decoration:underline dotted;cursor:pointer}
mark.dl{background:none;border-bottom:2px solid;padding:0}
mark.dl0{border-color:var(--dec);color:inherit}mark.dl1{border-color:var(--rul)}mark.dl2{border-color:var(--not)}
mark.hm{background:var(--hl);color:inherit;border-radius:2px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chip{font-size:11.5px;border:1px solid var(--bd);border-radius:10px;padding:0 8px;background:var(--bg);cursor:pointer;white-space:nowrap}
.chip.ty-d{border-color:var(--w-d)}.chip.ty-p{border-color:var(--w-p);border-style:dotted;color:var(--w-p)}.chip.ty-c{border-style:dashed}
.chip.gray{color:var(--mut);cursor:default;border-style:dashed}
.bw.clampable:not(.open){max-height:9.5em;overflow:hidden;position:relative}
.bw.clampable.ov:not(.open)::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2.4em;background:linear-gradient(rgba(255,255,255,0),var(--card))}
.bt{display:block;border:0;background:none;color:var(--acc);font-size:12px;padding:2px 0 0;cursor:pointer}
.more{display:block;width:100%;border:0;border-top:1px dashed var(--bd);background:var(--bg);color:var(--mut);padding:5px;font-size:12px}
.foot{padding:6px 10px;font-size:11.5px;color:var(--mut);border-top:1px solid var(--bd);background:var(--bg)}
.colmore{border:1px dashed var(--bd);background:var(--card);border-radius:8px;padding:8px;color:var(--mut);font-size:12.5px}
.empty{color:var(--mut);font-size:13px;padding:10px;border:1px dashed var(--bd);border-radius:10px;background:var(--card)}
.diffbox{padding:8px 10px;border-bottom:1px solid var(--bd);background:var(--bg);font-size:13.5px;white-space:pre-wrap}
.diffbox del,.rvv del{background:#fde2e2;color:#b42318;text-decoration:line-through}
.diffbox ins,.rvv ins{background:#dcf5df;color:#18672c;text-decoration:none}
:root[data-theme=dark] del{background:#4a1d1d;color:#ffb4b4}:root[data-theme=dark] ins{background:#17391d;color:#a8f0b6}
.diffbox .pl{font-weight:700;margin-top:4px}
/* wires */
.w .ln{fill:none;stroke-width:2;stroke-linecap:round}
.w.ty-d .ln{stroke:var(--w-d)}
.w.ty-c .ln{stroke:var(--w-c);stroke-dasharray:7 5;stroke-width:1.5}
.w.ty-p .ln{stroke:var(--w-p);stroke-dasharray:1.5 5;stroke-width:2.2;opacity:.85}
.w .hit{fill:none;stroke:transparent;stroke-width:12;pointer-events:stroke;cursor:pointer}
.w .dot{fill:var(--card);stroke-width:2}
.w.ty-d .dot{stroke:var(--w-d)}.w.ty-c .dot{stroke:var(--w-c)}.w.ty-p .dot{stroke:var(--w-p)}
#graph.dimmed .w{opacity:.12}
#graph.dimmed .w.on{opacity:1}
#graph.dimmed .w.on .ln{stroke-width:3.4}
.flash{animation:fl 1.2s}
@keyframes fl{0%{box-shadow:0 0 0 4px var(--acc)}100%{box-shadow:0 0 0 0 transparent}}
/* lists */
.pane{max-width:960px;margin:0 auto;padding:16px 16px 60px}
.pane h2{font-size:17px;margin:6px 0 10px}
.res{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;margin-bottom:8px;cursor:pointer}
.res:hover{border-color:var(--acc)}
.res .sn{color:var(--mut);font-size:13px;margin-top:3px;word-break:keep-all;overflow-wrap:anywhere}
.fl{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.rvbox{background:var(--card);border:1px solid var(--bd);border-radius:10px;margin-bottom:8px}
.rvbox>summary{padding:8px 12px;cursor:pointer;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.rvv{padding:4px 12px 12px;white-space:pre-wrap;font-size:13.5px}
table.info{border-collapse:collapse;width:100%;background:var(--card);font-size:13px}
table.info td,table.info th{border:1px solid var(--bd);padding:6px 8px;text-align:left}
.note{font-size:12.5px;color:var(--mut)}
#scrim{display:none}
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;top:var(--hh);bottom:0;left:0;width:min(86vw,340px);z-index:60;transform:translateX(-102%);transition:transform .2s;box-shadow:2px 0 12px rgba(0,0,0,.25)}
  body.nav #side{transform:none}
  body.nav #scrim{display:block;position:fixed;inset:var(--hh) 0 0 0;background:rgba(0,0,0,.35);z-index:55}
  #top h1{display:none}
  .hide-m{display:none}
  .card .ch .ti{min-width:0;flex-basis:100%}
}
@media (min-width:901px){#btnNav{display:none}}
/* 조문 하단 주석: 2026년 신설·개정·삭제는 진하게 */
.foot b{color:var(--fg);font-weight:800}
/* 명칭 입히기 */
.lb{background:var(--hl);border-bottom:2px solid var(--acc);border-radius:3px;padding:0 3px;cursor:pointer;font-weight:700;color:var(--fg);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.lb.open{background:none;border-bottom:0;padding:0;font-weight:inherit;cursor:auto;-webkit-user-select:text;user-select:text}
.lbn{display:inline-block;background:var(--hl);border:1px solid var(--acc);border-radius:10px;padding:0 8px;margin-right:4px;font-size:.85em;font-weight:700;cursor:pointer;-webkit-user-select:none;user-select:none}
#lbbar{display:none;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:80;background:var(--fg);color:var(--bg);border-radius:12px;padding:8px 10px;align-items:center;gap:10px;box-shadow:0 4px 16px rgba(0,0,0,.35);font-size:13px}
#lbbar span{flex:1;min-width:0}
#lbbar button{border:0;background:var(--acc);color:#fff;border-radius:8px;padding:8px 14px;font-size:14px;font-weight:700;white-space:nowrap}
#lbmenu{position:fixed;z-index:90;background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.28);padding:4px;min-width:170px}
#lbmenu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:7px;font-size:14px}
#lbmenu button:hover{background:var(--bg)}
.lbm{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:12px}
.lbbox{background:var(--card);color:var(--fg);border-radius:14px;width:min(94vw,460px);max-height:88vh;overflow:auto;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.lbbox h3{margin:0 0 8px;font-size:16px}
.lbbox .lbo{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--mut);max-height:7.5em;overflow:auto;margin-bottom:10px;word-break:keep-all;overflow-wrap:anywhere}
.lbbox input[type=text]{width:100%;border:1px solid var(--bd);background:var(--bg);color:var(--fg);border-radius:8px;padding:10px 12px;font-size:16px;outline:none}
.lbbox input[type=text]:focus{border-color:var(--acc)}
.lbact{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:flex-end}
.lbact .ib{padding:9px 16px;font-size:14px}
.lbrow{border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:13px}
.lbrow .nm{font-weight:700;font-size:14px}
.lbrow .og{color:var(--mut);margin:2px 0 6px;word-break:keep-all;overflow-wrap:anywhere}
.lbrow.stale{opacity:.6;border-style:dashed}
.lbrow .lbact{margin-top:4px;justify-content:flex-start}
.lbrow .lbact .ib{padding:4px 10px;font-size:12.5px}
#lbtoast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13px;z-index:120;max-width:88vw;text-align:center;display:none}
/* 모바일 맞춤 레이아웃 (900px 이하에서만 적용, 데스크톱 화면은 영향 없음) */
@media (max-width:900px){
  :root{--hh:92px}
  #top{flex-wrap:wrap;align-content:center;gap:6px 8px;padding:6px 10px}
  #top #tabs{flex:1;min-width:0}
  #top #tabs .ib{flex:1;padding:7px 4px;font-size:13px}
  #top #qwrap{order:5;flex:1 1 100%;max-width:none;min-width:0}
  #top #btnLb{padding:7px 10px}
  #q{font-size:16px;padding:8px 32px 8px 14px}
  #bar{flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;gap:6px 8px;padding:6px 10px;-webkit-overflow-scrolling:touch}
  #bar>b,#bar .lg{flex:none}
  #bar .note{display:none}
  #bar .lg{font-size:12px}
  #graph.stack{padding:10px 10px 90px 46px}
  #graph.stack .col{margin-bottom:14px}
  .card .ch{padding:8px 9px}
  .pb{padding:8px 9px}
  .pb .tx{line-height:1.7}
  .chip{padding:2px 9px}
  .row{padding:10px 12px 10px 18px}
  .pane{padding:12px 12px 70px}
  table.info{display:block;overflow-x:auto;white-space:nowrap}
  .res{padding:11px 12px}
  .more,.bt,.colmore{padding:9px 8px;font-size:13px}
}
</style>
</head>
<body>
<header id="top">
  <button class="ib" id="btnNav" aria-label="조문 목록">☰</button>
  <h1>관세법 연계뷰</h1>
  <div id="qwrap"><input id="q" type="search" placeholder="검색  (예: 천재지변 / 법 100 / 령 124의2)" autocomplete="off"><button id="qx" aria-label="지우기">✕</button></div>
  <div id="tabs">
    <button class="ib on" data-v="link">연계</button>
    <button class="ib" data-v="search" id="tabS">검색</button>
    <button class="ib" data-v="rev" id="tabR">개정·자료</button>
  </div>
  <button class="ib" id="btnLb" title="내가 붙인 명칭 관리 (내보내기/가져오기)">🏷<span class="hide-m"> 명칭</span></button>
  <div class="sp hide-m"></div>
  <button class="ib hide-m" id="fm" title="글자 작게">가−</button>
  <button class="ib hide-m" id="fp" title="글자 크게">가+</button>
  <button class="ib hide-m" id="th" title="다크모드">◐</button>
</header>
<div id="scrim"></div>
<div id="lbbar"><span>선택한 문구에 명칭을 붙일 수 있습니다</span><button id="lbbarBtn" type="button">🏷 명칭 붙이기</button></div>
<div id="lbtoast"></div>
<div id="app">
  <aside id="side"></aside>
  <main id="main"></main>
</div>

<script>
"use strict";
const D = /*__DATA__*/null;
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CIRC = (() => { let s = ''; for (let c = 0x2460; c <= 0x2473; c++) s += String.fromCharCode(c); for (let c = 0x3251; c <= 0x325F; c++) s += String.fromCharCode(c); return s; })();
const circ = pn => (pn == null || pn === '0') ? '' : (CIRC[Number(pn) - 1] || ('제' + pn + '항'));
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

/* ---------- 데이터 준비 ---------- */
const docs = D.docs;
const ARTS = docs.map((_, i) => D.arts[String(i)] || []);
const AM = ARTS.map(l => new Map(l.map(a => [a.no, a])));
const EDGES = D.edges.map(e => ({ fd: e[0], fn: e[1], fp: e[2], td: e[3], tn: e[4], tp: e[5], ty: e[6] }));
const byArt = new Map();
const pushM = (k, e) => { if (!byArt.has(k)) byArt.set(k, []); byArt.get(k).push(e); };
EDGES.forEach(e => { pushM(e.fd + '|' + e.fn, e); pushM(e.td + '|' + e.tn, e); });
const COLN = docs.map(d => d.col);
const hasNotice = docs.some(d => d.col === 3);
const TYN = { d: '위임', c: '인용', p: '벌칙' };
const PRI = { d: 0, p: 1, c: 2 };
const nkey = n => { const [a, b] = String(n).split('의'); return Number(a) * 1000 + Number(b || 0); };
const dlabel = d => docs[d].label;
const aname = (d, n) => `${dlabel(d)} 제${n}조`;
// 가장 최근 개정 비교(문서별 마지막 전환)
const REV = {}; // di -> {tr, map: no->change}
D.rev.forEach(r => { REV[r.doc] = { tr: r, map: new Map(r.changes.map(c => [c.no, c])) }; });
// 항별 연결 개수(사이드바 표시용)
const linkCount = new Map();
EDGES.forEach(e => {
  [[e.fd, e.fn, e.td], [e.td, e.tn, e.fd]].forEach(([d, n, od]) => {
    const k = d + '|' + n; if (!linkCount.has(k)) linkCount.set(k, [0, 0, 0, 0]);
    linkCount.get(k)[COLN[od]]++;
  });
});

/* ---------- 상태 ---------- */

  const w = document.createElement('div'); w.id = 'lbm'; w.className = 'lbm';
  const rows = LABELS.slice().sort((a, b) => docs.findIndex(x => x.id === a.doc) - docs.findIndex(x => x.id === b.doc) || nkey(a.no) - nkey(b.no) || a.pn.localeCompare(b.pn) || a.ix - b.ix || a.s - b.s);
  let h = `<div class="lbbox lbmgr"><h3>내가 붙인 명칭 (${LABELS.length}개)</h3><div class="note" style="margin-bottom:8px">이 브라우저에 저장됩니다. 다른 기기에서 쓰려면 내보내기 → 가져오기 하세요.</div>`;
  if (!rows.length) h += '<div class="empty">아직 붙인 명칭이 없습니다. 조·항·문장·단어를 드래그한 뒤 우클릭(모바일은 하단 버튼)하세요.</div>';
  rows.forEach(l => {
    const di = docs.findIndex(x => x.id === l.doc), ok = lbValid(l);
    const where = `${di >= 0 ? dlabel(di) : l.doc} 제${l.no}조${l.pn === 'H' ? '' : l.pn === '0' ? '' : circ(l.pn)}${l.ix >= 0 ? ' 호' : ''}`;
    h += `<div class="lbrow${ok ? '' : ' stale'}"><div class="nm">${esc(l.name)}</div><div class="og">${esc(where)} · ${esc(l.txt.length > 60 ? l.txt.slice(0, 60) + '…' : l.txt)}${ok ? '' : ' <b>(법령 원문이 달라져 적용 안 됨)</b>'}</div><div class="lbact">${ok ? `<button class="ib" data-go2="${di}|${esc(l.no)}">이동</button><button class="ib" data-ed="${esc(l.id)}">수정</button>` : ''}<button class="ib" data-rm="${esc(l.id)}">삭제</button></div></div>`;
  });
  h += `<div class="lbact"><button class="ib" data-a="exp">내보내기</button><button class="ib" data-a="imp">가져오기</button><button class="ib" data-a="close">닫기</button></div><input id="lbfile" type="file" accept=".json,application/json" style="display:none"></div>`;
  w.innerHTML = h; document.body.appendChild(w);
  w.addEventListener('click', ev => {
    const b = ev.target.closest('button'); if (!b) return;
    if (b.dataset.a === 'close') w.remove();
    else if (b.dataset.a === 'exp') lbExport();
    else if (b.dataset.a === 'imp') $('#lbfile', w).click();
    else if (b.dataset.go2) { w.remove(); const p = b.dataset.go2.split('|'); focusArt(p[0], p[1]); }
    else if (b.dataset.ed) { const l = lbById(b.dataset.ed); w.remove(); lbOpenModal(null, l); }
    else if (b.dataset.rm) { if (confirm('이 명칭을 삭제(원복)할까요?')) lbRemove(b.dataset.rm); }
  });
  $('#lbfile', w).addEventListener('change', ev => {
    const f = ev.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const j = JSON.parse(rd.result), arr = Array.isArray(j) ? j : j.labels; let n = 0;
        (arr || []).forEach(l => { if (l && l.id && l.doc && l.no != null && l.pn != null && l.ix != null && l.txt != null && l.name) { LABELS = LABELS.filter(x => x.id !== l.id); LABELS.push({ id: String(l.id), doc: l.doc, no: String(l.no), pn: String(l.pn), ix: Number(l.ix), s: Number(l.s) || 0, e: Number(l.e) || 0, h: l.h ? 1 : 0, txt: String(l.txt), name: String(l.name), ts: l.ts || Date.now() }); n++; } });
        lbPersist(); lbRerender(); lbManager(); lbToast(n + '개를 가져왔습니다');
      } catch (e) { lbToast('가져오기 실패: 올바른 명칭 파일이 아닙니다'); }
    };
    rd.readAsText(f);
  });
}
function lbExport() {
  const d = new Date(), z = x => String(x).padStart(2, '0');
  const blob = new Blob([JSON.stringify({ v: 1, labels: LABELS }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `관세법_명칭_${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}.json`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
// 모바일: 문구를 드래그(선택)하면 하단에 '명칭 붙이기' 버튼 표시 / 데스크톱: 선택 후 우클릭
const COARSE = window.matchMedia ? matchMedia('(pointer:coarse)') : { matches: false };
let lbPending = null, lbSelT = null;
function lbBarHide() { lbPending = null; $('#lbbar').style.display = 'none'; }
function lbSelUpdate() {
  if (!COARSE.matches || S.view !== 'link' || $('#lbm')) { lbBarHide(); return; }
  const a = lbAnalyze();
  if (a && a.info) { lbPending = a.info; $('#lbbar').style.display = 'flex'; } else lbBarHide();
}
document.addEventListener('selectionchange', () => { clearTimeout(lbSelT); lbSelT = setTimeout(lbSelUpdate, 250); });
['mousedown', 'touchstart'].forEach(n => $('#lbbarBtn').addEventListener(n, ev => ev.preventDefault()));
$('#lbbarBtn').addEventListener('click', () => { if (lbPending) { const i = lbPending; lbBarHide(); lbOpenModal(i); } });
$('#btnLb').addEventListener('click', lbManager);
document.addEventListener('contextmenu', ev => {
  if (S.view !== 'link' || !ev.target.closest) return;
  const l = ev.target.closest('.lb, .lbn');
  if (l) { ev.preventDefault(); lbMenu(ev.clientX, ev.clientY, { lid: l.dataset.lid }); return; }
  if (!ev.target.closest('#graph')) return;
  const a = lbAnalyze();
  if (a) { ev.preventDefault(); lbMenu(ev.clientX, ev.clientY, { a }); }
});
document.addEventListener('mousedown', ev => { if (!ev.target.closest('#lbmenu') && Date.now() - lbMenuAt > 700) lbCloseUI(); }, true);
document.addEventListener('touchstart', ev => { if (!ev.target.closest('#lbmenu') && Date.now() - lbMenuAt > 700) lbCloseUI(); }, { capture: true, passive: true });
let lpT = null, lpAt = 0; // 모바일: 명칭을 길게 누르면 수정/원복 메뉴
document.addEventListener('touchstart', ev => {
  const l = ev.target.closest && ev.target.closest('.lb, .lbn'); if (!l) return;
  const tc = ev.touches[0];
  lpT = setTimeout(() => { lpAt = Date.now(); lbMenu(tc.clientX, tc.clientY, { lid: l.dataset.lid }); }, 520);
}, { passive: true });
['touchend', 'touchmove', 'touchcancel'].forEach(n => document.addEventListener(n, () => clearTimeout(lpT), { passive: true }));

/* ---------- 라우팅/이벤트 ---------- */
function setView(v) {
  S.view = v; $$('#tabs .ib').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if (v === 'link') renderLink(); else if (v === 'search') renderSearch(); else renderRev();
}
function focusArt(d, n, opts) {
  d = Number(d); if (!AM[d] || !AM[d].has(n)) return;
  S.d = d; S.n = n; S.side = d; S.lim = {}; S.pin = null;
  if (S.view !== 'link') { S.view = 'link'; $$('#tabs .ib').forEach(b => b.classList.toggle('on', b.dataset.v === 'link')); }
  const hash = '#' + docs[d].id + '/' + n;
  if (location.hash !== hash) history.replaceState(null, '', hash);
  renderSide(); renderLink(false);
  document.body.classList.remove('nav');
}
function flashTo(id) {
  const root = $('#graph'); if (!root) return false;
  const el = root.querySelector(`.pb[data-b="${CSS.escape(id)}"]`) || root.querySelector(`[data-k="${CSS.escape(id.split('|').slice(0, 2).join('|'))}"]`);
  if (!el) return false;
  el.scrollIntoView({ block: 'center', behavior: 'smooth' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1300); return true;
}
document.addEventListener('click', ev => {
  const t = ev.target;
  let el;
  if ((el = t.closest('.lbn, .lb:not(.open)'))) { // 명칭 클릭: 원문 ↔ 명칭 전환
    if (Date.now() - lpAt > 800) { const id = el.dataset.lid; S.lbOpen.has(id) ? S.lbOpen.delete(id) : S.lbOpen.add(id); lbRerender(); }
    ev.stopPropagation(); ev.preventDefault(); return;
  }
  if ((el = t.closest('[data-open]'))) {
    const w = el.previousElementSibling, pb = el.closest('.pb');
    if (w && pb) { const id = pb.dataset.b; if (S.open.has(id)) S.open.delete(id); else S.open.add(id); w.classList.toggle('open'); clampPass(); alignCols(); drawWires(); }
    ev.stopPropagation(); return;
  }
  if ((el = t.closest('[data-diff]'))) { const k = el.dataset.diff; S.showDiff.has(k) ? S.showDiff.delete(k) : S.showDiff.add(k); renderLink(true); ev.stopPropagation(); return; }
  if ((el = t.closest('[data-exp]'))) { S.expand.add(el.dataset.exp); renderLink(true); return; }
  if ((el = t.closest('[data-lim]'))) { const c = el.dataset.lim; S.lim['a' + c] = (S.lim['a' + c] || 10) + 12; S.lim['b' + c] = (S.lim['b' + c] || 10) + 12; renderLink(true); return; }
  if ((el = t.closest('[data-f]'))) { S.f[el.dataset.f] = !S.f[el.dataset.f]; renderLink(true); return; }
  if (t.closest('[data-mode]')) { S.mode = MODE === 'cols' ? 'stack' : 'cols'; store.set('mode', S.mode); renderLink(true); return; }
  if ((el = t.closest('[data-sc]'))) { const i = Number(el.dataset.sc); S.scope.has(i) ? S.scope.delete(i) : S.scope.add(i); renderSearch(); return; }
  if ((el = t.closest('[data-sd]'))) { S.side = Number(el.dataset.sd); renderSide(); return; }
  if ((el = t.closest('[data-go]'))) {
    if (el.classList.contains('ch') && String(window.getSelection()).trim()) return; // 조 제목을 드래그 선택한 직후에는 이동하지 않음(명칭 붙이기용)
    const parts = el.dataset.go.split('|');
    if (el.classList.contains('chip') && S.view === 'link' && flashTo(parts[0] + '|' + parts[1] + '|' + (parts[2] || ''))) return;
    focusArt(parts[0], parts[1]); ev.stopPropagation(); return;
  }
  if ((el = t.closest('.w .hit, .w'))) { const g = t.closest('.w'); if (g) { S.pin = (S.pin === g.dataset.wb) ? null : g.dataset.wb; applyHighlight(); } return; }
  if ((el = t.closest('.pb'))) { const id = el.dataset.b; S.pin = S.pin === id ? null : id; if (S.pin) el.classList.add('pin'); $$('.pb.pin').forEach(x => { if (x !== el || !S.pin) x.classList.remove('pin'); }); applyHighlight(); return; }
}, true);
document.addEventListener('mouseover', ev => {
  const el = ev.target.closest && ev.target.closest('.pb, .w');
  if (!el || S.view !== 'link') return;
  applyHighlight(el.classList.contains('w') ? el.dataset.wb : el.dataset.b);
});
document.addEventListener('mouseout', ev => {
  const el = ev.target.closest && ev.target.closest('.pb, .w');
  if (el && S.view === 'link') applyHighlight();
});
$('#tabs').addEventListener('click', ev => { const b = ev.target.closest('[data-v]'); if (b) setView(b.dataset.v); });
let qt = null;
$('#q').addEventListener('input', e => {
  S.q = e.target.value; $('#qx').style.display = S.q ? 'block' : 'none';
  clearTimeout(qt); qt = setTimeout(() => { if (S.q.trim()) setView('search'); else { $('#tabS').textContent = '검색'; if (S.view === 'search') setView('link'); else if (S.view === 'link') renderLink(true); } }, 220);
});
$('#q').addEventListener('keydown', e => { if (e.key === 'Escape') { $('#qx').click(); } if (e.key === 'Enter') { clearTimeout(qt); if (S.q.trim()) setView('search'); } });
$('#qx').addEventListener('click', () => { $('#q').value = ''; S.q = ''; $('#qx').style.display = 'none'; $('#tabS').textContent = '검색'; if (S.view === 'search') setView('link'); else if (S.view === 'link') renderLink(true); });
$('#btnNav').addEventListener('click', () => document.body.classList.toggle('nav'));
$('#scrim').addEventListener('click', () => document.body.classList.remove('nav'));
function setFs(v) { S.fs = Math.max(12, Math.min(22, v)); document.documentElement.style.setProperty('--fs', S.fs + 'px'); store.set('fs', S.fs); if (S.view === 'link') requestAnimationFrame(() => { clampPass(); alignCols(); drawWires(); }); }
$('#fm').addEventListener('click', () => setFs(S.fs - 1));
$('#fp').addEventListener('click', () => setFs(S.fs + 1));
$('#th').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
  const nx = cur === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', nx); store.set('theme', nx);
});
let rt = null;
const redraw = () => { clearTimeout(rt); rt = setTimeout(() => { if (S.view !== 'link' || !G) return; const wide = $('#main').clientWidth >= 980; const m = S.mode === 'auto' ? (wide ? 'cols' : 'stack') : S.mode; if (m !== MODE) renderLink(true); else { clampPass(); alignCols(); drawWires(); } }, 120); };
window.addEventListener('resize', redraw);
if (window.ResizeObserver) new ResizeObserver(redraw).observe($('#main'));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (S.view === 'link') drawWires(); });
window.addEventListener('hashchange', () => { const m = decodeURIComponent(location.hash.slice(1)).split('/'); const di = docs.findIndex(d => d.id === m[0]); if (di >= 0 && m[1] && AM[di].has(m[1]) && !(S.d === di && S.n === m[1])) focusArt(di, m[1]); });

/* ---------- 시작 ---------- */
(function init() {
  let d = 0, n = AM[0].has('100') ? '100' : (ARTS[0][0] || {}).no;
  const m = decodeURIComponent(location.hash.slice(1)).split('/');
  const di = docs.findIndex(x => x.id === m[0]);
  if (di >= 0 && m[1] && AM[di].has(m[1])) { d = di; n = m[1]; }
  S.d = d; S.n = n; S.side = d;
  renderSide(); renderLink(false);
})();
</script>
