<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>관세법 연계뷰</title>
<style>
:root{
  --bg:#f4f6fa; --panel:#fff; --ink:#1c2430; --mute:#6b7685; --line:#dfe4ec;
  --law:#1f5fbf; --law-bg:#e8f0fc; --dec:#1b7f4b; --dec-bg:#e6f5ec; --rul:#c2570c; --rul-bg:#fdf0e3;
  --gos:#6b7685; --gos-bg:#eef0f3; --mark:#fff2a8; --ref:#1f5fbf; --hit:#ffe08a;
  --fs:15px;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#10141b; --panel:#171d27; --ink:#e6ebf3; --mute:#8d98a8; --line:#2a3342;
    --law:#7db0ff; --law-bg:#17263d; --dec:#63d49a; --dec-bg:#132a20; --rul:#ffa65c; --rul-bg:#2d1f12;
    --gos:#98a3b3; --gos-bg:#1e242e; --mark:#5a4d10; --ref:#7db0ff; --hit:#6b5500; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs)/1.65 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top)) 16px 8px}
.top{display:flex;align-items:center;gap:8px;max-width:1280px;margin:0 auto}
h1{font-size:16px;margin:0;flex:1;letter-spacing:-.2px}
h1 small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
.tool{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;min-width:38px;height:34px;font:inherit;font-size:13px;cursor:pointer}
.tool[aria-pressed=true]{background:var(--ink);color:var(--panel)}
.chips{display:flex;gap:6px;overflow-x:auto;max-width:1280px;margin:8px auto 0;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.chip[aria-selected=true]{background:var(--law);border-color:var(--law);color:#fff}
main{max-width:1280px;margin:0 auto;padding:14px 16px 60px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mute);margin:2px 0 10px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.summary{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.summary b{font-weight:600}
.flow-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600}
.pill.law{background:var(--law-bg);color:var(--law)} .pill.decree{background:var(--dec-bg);color:var(--dec)}
.pill.rule{background:var(--rul-bg);color:var(--rul)} .pill.gos{background:var(--gos-bg);color:var(--gos)}
.arrow{color:var(--mute)}
.colhead{display:none}
.flow{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.grp{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-bottom:14px}
.cell.r{margin-left:18px;padding-left:12px;border-left:3px solid var(--rul-bg)}
.cell.r>*+*{margin-top:8px}
@media (min-width:1000px){
  .flow{grid-template-columns:minmax(0,1fr) minmax(0,2fr);align-items:start;gap:18px}
  .law-col{position:sticky;top:112px}
  .colhead{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;font-size:12px;font-weight:700;color:var(--mute);margin-bottom:6px}
  .grp{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
  .cell.r{margin-left:0;padding-left:0;border-left:0}
  .grp.has-r .cell.d{position:relative}
  .grp.has-r .cell.d::after{content:"";position:absolute;right:-12px;top:22px;width:12px;border-top:2px solid var(--rul)}
}
.card{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;overflow:hidden;scroll-margin-top:130px}
.card.law{--c:var(--law);--cbg:var(--law-bg)} .card.decree{--c:var(--dec);--cbg:var(--dec-bg)} .card.rule{--c:var(--rul);--cbg:var(--rul-bg)}
.card.ref-only{opacity:.88;border-left-style:dashed}
.card.flash{animation:fl 1.4s ease}
@keyframes fl{0%,60%{box-shadow:0 0 0 3px var(--hit)}100%{box-shadow:none}}
.ch{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;background:var(--cbg)}
.badge{flex:none;background:var(--c);color:#fff;border-radius:6px;padding:1px 8px;font-size:12.5px;font-weight:700;white-space:nowrap}
.ttl{font-weight:650;line-height:1.4;flex:1;min-width:0}
.ttl small{display:block;font-weight:400;font-size:11.5px;color:var(--mute);margin-top:1px}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:11px;padding:0 7px;border-radius:999px;border:1px solid var(--c);color:var(--c);line-height:18px}
.tag.k{border-color:var(--gos);color:var(--gos)}
.cb{padding:8px 12px 12px;position:relative}
.cb.clamp{max-height:11.5em;overflow:hidden}
.cb.clamp::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3.2em;background:linear-gradient(transparent,var(--panel))}
.more{display:block;width:100%;border:0;border-top:1px solid var(--line);background:transparent;color:var(--mute);padding:7px;font:inherit;font-size:12.5px;cursor:pointer}
p.pa{margin:4px 0;word-break:keep-all;overflow-wrap:anywhere}
p.l2{margin-left:1.1em} p.l3{margin-left:2.2em}
mark.d{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
.ref{color:var(--ref);text-decoration:underline dotted;text-underline-offset:3px}
.ref.go{cursor:pointer;font-weight:600}
.ref.hit{background:var(--hit);border-radius:3px;font-weight:700;text-decoration:none}
.quiz mark.d,.quiz .ref.hit{filter:blur(6px);cursor:pointer}
.quiz mark.d.open,.quiz .ref.hit.open{filter:none}
.empty{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;color:var(--mute);font-size:13px}
.empty.k{background:var(--gos-bg);border-color:var(--gos)}
details.ref-list{margin-top:6px}
details.ref-list>summary{cursor:pointer;color:var(--mute);font-size:13px;padding:8px 0}
.foot{margin-top:28px;font-size:12px;color:var(--mute);line-height:1.6}
.notice{font-size:12.5px;color:var(--mute);margin:-4px 0 12px}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>관세법 법·령·칙 연계뷰<small id="basis"></small></h1>
    <button class="tool" id="quizBtn" aria-pressed="false" title="위임 문구·근거 조문을 가려서 암기">가리기</button>
    <button class="tool" id="fMinus" aria-label="글자 작게">가−</button>
    <button class="tool" id="fPlus" aria-label="글자 크게">가+</button>
  </div>
  <nav class="chips" id="chips" role="tablist"></nav>
</header>
<main id="main"></main>

<script>
const DATA = [{"law": {"kind": "law", "no": "10", "title": "천재지변 등으로 인한 기한의 연장", "chapter": "제1장 총칙", "section": "제3절 기간과 기한", "paras": [{"l": 0, "t": "세관장은 천재지변이나 그 밖에 대통령령으로 정하는 사유로 이 법에 따른 신고, 신청, 청구, 그 밖의 서류의 제출, 통지, 납부 또는 징수를 정하여진 기한까지 할 수 없다고 인정되는 경우에는 1년을 넘지 아니하는 기간을 정하여 대통령령으로 정하는 바에 따라 그 기한을 연장할 수 있다. 이 경우 세관장은 필요하다고 인정하는 경우에는 납부할 관세에 상당하는 담보를 제공하게 할 수 있다."}], "deleg": ["령"]}, "decrees": [{"kind": "decree", "no": "2", "title": "천재지변 등으로 인한 기한의 연장", "chapter": "제1장 총칙", "section": "제1절 통칙", "paras": [{"l": 1, "t": "①법 제10조에서 “대통령령으로 정하는 사유”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다."}, {"l": 2, "t": "1. 전쟁ㆍ화재 등 재해나 도난으로 인하여 재산에 심한 손실을 입은 경우"}, {"l": 2, "t": "2. 사업에 현저한 손실을 입은 경우"}, {"l": 2, "t": "3. 사업이 중대한 위기에 처한 경우"}, {"l": 2, "t": "4. 그 밖에 세관장이 제1호부터 제3호까지의 규정에 준하는 사유가 있다고 인정하는 경우"}, {"l": 1, "t": "②세관장은 법 제10조의 규정에 의하여 납부기한을 연장하는 때에는 관세청장이 정하는 기준에 의하여야 한다."}, {"l": 1, "t": "③법 제10조의 규정에 의하여 납부기한을 연장받고자 하는 자는 다음 각호의 사항을 기재한 신청서를 당해 납부기한이 종료되기 전에 세관장에게 제출하여야 한다."}, {"l": 2, "t": "1. 납세의무자의 성명ㆍ주소 및 상호"}, {"l": 2, "t": "2. 납부기한을 연장받고자 하는 세액 및 당해 물품의 신고일자ㆍ신고번호ㆍ품명ㆍ규격ㆍ수량 및 가격"}, {"l": 2, "t": "3. 납부기한을 연장받고자 하는 사유 및 기간"}, {"l": 1, "t": "④세관장은 법 제10조에 따라 납부기한을 연장한 때에는 법 제39조에 따른 납부고지를 해야 한다."}, {"l": 1, "t": "⑤ 삭제"}, {"l": 1, "t": "⑥세관장은 법 제10조의 규정에 의하여 납부기한연장을 받은 납세의무자가 다음 각호의 1에 해당하게 된 때에는납부기한연장을 취소할 수 있다."}, {"l": 2, "t": "1. 관세를 지정한 납부기한내에 납부하지 아니하는 때"}, {"l": 2, "t": "2. 재산상황의 호전 기타 상황의 변화로 인하여 납부기한연장을 할 필요가 없게 되었다고 인정되는 때"}, {"l": 2, "t": "3. 파산선고, 법인의 해산 기타의 사유로 당해 관세의 전액을 징수하기 곤란하다고 인정되는 때"}, {"l": 1, "t": "⑦세관장은 제6항에 따라 납부기한연장을 취소한 때에는 15일 이내의 납부기한을 정하여 법 제39조에 따른 납부고지를 해야 한다."}], "deleg": ["령"], "link": "위임", "rules": [{"kind": "rule", "no": "4의3", "title": "운임 등의 결정", "chapter": "", "section": "", "paras": [{"l": 1, "t": "① 영 제20조제2항에 따른 운임은 다음 각 호에 따른다."}, {"l": 2, "t": "1. 법 제241조제2항제3호의2가목에 따른 운송수단이 외국에서 우리나라로 운항하여 수입되는 경우: 해당 운송수단이 수출항으로부터 수입항에 도착할 때까지의 연료비, 승무원의 급식비, 급료, 수당, 선원 등의 송출비용 및 그 밖의 비용 등 운송에 실제로 소요되는 금액"}, {"l": 2, "t": "2. 하나의 용선계약으로 여러가지 화물을 여러 차례에 걸쳐 왕복운송하거나 여러가지 화물을 하나의 운송계약에 따라 일괄운임으로 지급하는 경우: 수입되는 물품의 중량을 기준으로 계산하여 배분한 운임. 다만, 수입되는 물품의중량을 알 수 없거나 중량을 기준으로 계산하는 것이 현저히 불합리한 경우에는 가격을 기준으로 계산하여 배분한 운임으로 한다."}, {"l": 2, "t": "3. 운송계약상 선적항 및 수입항의 구분 없이 총 허용정박 시간만 정하여 체선료(滯船料) 또는 조출료(早出料)의 발생장소를 명확히 구분할 수 없는 경우: 총 허용정박 시간을 선적항과 수입항에서의 허용 정박시간으로 반분(半分)하여 계산된 선적항에서의 체선료를 포함한 운임. 이 경우 실제 공제받은 조출료는 운임에 포함하지 않는다."}, {"l": 2, "t": "4. 법 제254조의2제6항에 따라 통관하는 탁송품으로서 그 운임을 알 수 없는 경우: 관세청장이 정하는 탁송품 과세운임표에 따른 운임"}, {"l": 1, "t": "② 영 제20조제3항에서 “재정경제부령으로 정하는 물품”이란 다음 각 호의 어느 하나에 해당하는 물품을 말한다."}, {"l": 2, "t": "1. 무상으로 반입하는 상품의 견본, 광고용품 및 그 제조용 원료로서 운임 및 보험료를 제외한 총 과세가격이 20만원 이하인 물품"}, {"l": 2, "t": "2. 수출물품의 제조ㆍ가공에 사용할 외화획득용 원재료로서 세관장이 수출계약의 이행에 필요하다고 인정하여 무상으로 반입하는 물품"}, {"l": 2, "t": "3. 계약조건과 다르거나 하자보증기간 안에 고장이 생긴 수입물품을 대체ㆍ수리 또는 보수하기 위해 무상으로 반입하는 물품"}, {"l": 2, "t": "4. 계약조건과 다르거나 하자보증 기간 안에 고장이 생긴 수입물품을 외국으로 반출한 후 이를 수리하여 무상으로반입하는 물품으로서 운임 및 보험료를 제외한 총 과세가격이 20만원 이하인 물품"}, {"l": 2, "t": "5. 계약조건과 다르거나 하자보증 기간 안에 고장이 생긴 수출물품을 수리 또는 대체하기 위해 무상으로 반입하는물품"}, {"l": 2, "t": "6. 신문사, 방송국 또는 통신사에서 반입하는 뉴스를 취재한 사진필름, 녹음테이프 및 이와 유사한 취재물품"}, {"l": 2, "t": "7. 우리나라의 거주자가 받는 물품으로서 자가 사용할 것으로 인정되는 것 중 운임 및 보험료를 제외한 총 과세가격이 20만원 이하인 물품"}, {"l": 2, "t": "8. 제48조의2제1항에 따른 우리나라 국민, 외국인 또는 재외영주권자가 입국할 때 반입하는 이사화물로서 운임 및보험료를 제외한 총 과세가격이 50만원 이하인 물품"}, {"l": 2, "t": "9. 여행자가 휴대하여 반입하는 물품"}, {"l": 2, "t": "10. 항공사가 자기 소유인 운송수단으로 운송하여 반입하는 항공기용품과 외국의 본사 또는 지사로부터 무상으로송부받은 해당 운송사업에 사용할 소모품 및 사무용품"}, {"l": 2, "t": "11. 항공기 외의 일반적인 운송방법으로 운송하기로 계약된 물품으로서 해당 물품의 제작지연, 그 밖에 수입자의 귀책사유가 아닌 사유로 수출자가 그 운송방법의 변경에 따른 비용을 부담하고 항공기로 운송한 물품"}, {"l": 2, "t": "12. 항공기 외의 일반적인 운송방법으로 운송하기로 계약된 물품으로서 천재지변이나 영 제2조제1항 각 호에 해당하는 사유로 운송수단을 변경하거나 해외 거래처를 변경하여 항공기로 긴급하게 운송하는 물품"}, {"l": 1, "t": "③ 제2항 각 호의 물품은 다음 각 호의 구분에 따라 운임을 산출한다. 이 경우 다음 각 호의 적용 운임이 실제 발생한 항공운임을 초과하는 경우에는 해당 항공운임을 적용한다."}, {"l": 2, "t": "1. 제2항제1호부터 제9호까지의 물품: 우리나라에서 적용하고 있는 선편소포우편물요금표에 따른 요금. 이 경우 물품의 중량이 선편소포우편물요금표에 표시된 최대중량을 초과하는 경우에는 최대중량의 요금에 최대중량을 초과하는 중량에 해당하는 요금을 가산하여 계산한다."}, {"l": 2, "t": "2. 제2항제10호부터 제12호까지의 물품: 법 제225조제1항에 따른 선박회사(그 업무를 대행하는 자를 포함한다)가해당 물품에 대해 통상적으로 적용하는 운임"}, {"l": 1, "t": "④ 영 제20조제3항에 따른 제2항 각 호의 물품에 대한 보험료는 보험사업자가 통상적으로 적용하는 항공기 외의 일반적인 운송방법에 대한 보험료로 계산할 수 있다."}], "deleg": ["칙"], "link": "인용"}]}, {"kind": "decree", "no": "32의4", "title": "세액의 보정", "chapter": "제2장 과세가격과 관세의 부과ㆍ징수 등", "section": "제5절 부과와 징수", "paras": [{"l": 1, "t": "①세관장은 법 제38조의2제2항 전단의 규정에 의하여 세액의 보정을 통지하는 경우에는 다음 각호의 사항을 기재한 보정통지서를 교부하여야 한다."}, {"l": 2, "t": "1. 당해 물품의 수입신고번호와 품명ㆍ규격 및 수량"}, {"l": 2, "t": "2. 보정전 당해 물품의 품목분류ㆍ과세표준ㆍ세율 및 세액"}, {"l": 2, "t": "3. 보정후 당해 물품의 품목분류ㆍ과세표준ㆍ세율 및 세액"}, {"l": 2, "t": "4. 보정사유 및 보정기한"}, {"l": 2, "t": "5. 그 밖의 참고사항"}, {"l": 1, "t": "②법 제38조의2제1항 및 제2항 후단의 규정에 따라 신고납부한 세액을 보정하고자 하는 자는 세관장에게 세액보정을 신청한 다음에 이미 제출한 수입신고서를 교부받아 수입신고서상의 품목분류ㆍ과세표준ㆍ세율 및 세액 그 밖의관련사항을 보정하고, 그 보정한 부분에 서명 또는 날인하여 세관장에게 제출하여야 한다."}, {"l": 1, "t": "③ 삭제"}, {"l": 1, "t": "④법 제38조의2제5항 본문에 따라 부족세액에 가산하여야 할 이율의 계산에 관하여는 제56조제2항의 규정을 준용한다."}, {"l": 1, "t": "⑤ 법 제38조의2제5항제1호에서 “국가 또는 지방자치단체가 직접 수입하는 물품 등 대통령령으로 정하는 물품”이란 다음 각 호의 어느 하나에 해당하는 물품을 말한다."}, {"l": 2, "t": "1. 국가 또는 지방자치단체(「지방자치법」에 따른 지방자치단체조합을 포함한다. 이하 같다)가 직접 수입하는 물품과 국가 또는 지방자치단체에 기증되는 물품"}, {"l": 2, "t": "2. 우편물. 다만, 법 제241조에 따라 수입신고를 해야 하는 것은 제외한다."}, {"l": 1, "t": "⑥ 법 제38조의2제5항제2호에서 “대통령령으로 정하는 정당한 사유가 있는 경우”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다."}, {"l": 2, "t": "1. 법 제10조에 따른 기한 연장 사유에 해당하는 경우"}, {"l": 2, "t": "2. 제1조의3에 따른 법 해석에 관한 질의ㆍ회신 등에 따라 신고ㆍ납부했으나 이후 동일한 사안에 대해 다른 과세처분을 하는 경우"}, {"l": 2, "t": "3. 그 밖에 납세자가 의무를 이행하지 않은 정당한 사유가 있는 경우"}, {"l": 1, "t": "⑦ 법 제38조의2제5항제2호에 따라 부족세액에 가산하여야 할 금액을 면제받으려는 자는 다음 각 호의 사항을 적은 신청서를 세관장에게 제출하여야 한다. 이 경우 제2호 및 제3호와 관련한 증명자료가 있으면 이를 첨부할 수 있다."}, {"l": 2, "t": "1. 납세의무자의 성명 또는 상호 및 주소"}, {"l": 2, "t": "2. 면제받으려는 금액"}, {"l": 2, "t": "3. 정당한 사유"}, {"l": 1, "t": "⑧ 세관장은 제7항에 따른 신청서를 제출받은 경우에는 신청일부터 20일 이내에 면제 여부를 서면으로 통지하여야한다."}], "deleg": ["령"], "link": "인용", "rules": []}, {"kind": "decree", "no": "283의2", "title": "사업에 관한 허가 등의 제한의 예외", "chapter": "제13장 보칙", "section": "", "paras": [{"l": 1, "t": "① 법 제326조의2제1항 단서에서 “대통령령으로 정하는 사유”란 다음 각 호의 어느 하나에 해당하는 경우로서 세관장이 인정하는 사유를 말한다."}, {"l": 2, "t": "1. 공시송달의 방법으로 납부고지된 경우"}, {"l": 2, "t": "2. 법 제10조에 따른 기한의 연장 사유에 해당하는 경우"}, {"l": 2, "t": "3. 「국세징수법 시행령」 제101조제1항제2호 및 제4호에 해당하는 경우"}, {"l": 2, "t": "4. 법 제19조제10항에 따라 양도담보재산으로써 발생한 납세의무(이하 이 호에서 “물적납세의무”라 한다)를 부담하는 양도담보권자가 그 물적납세의무와 관련된 관세ㆍ내국세등 및 강제징수비를 체납한 경우"}, {"l": 2, "t": "5. 제1호부터 제4호까지의 규정에 준하는 사유가 있는 경우"}, {"l": 1, "t": "② 법 제326조의2제2항 단서에서 “대통령령으로 정하는 사유”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다."}, {"l": 2, "t": "1. 제1항 각 호의 어느 하나에 해당하는 경우로서 세관장이 인정하는 경우"}, {"l": 2, "t": "2. 그 밖에 세관장이 납세자에게 납부가 곤란한 사정이 있다고 인정하는 경우"}], "deleg": ["령"], "link": "인용", "rules": []}], "rules_direct": []}, {"law": {"kind": "law", "no": "38", "title": "신고납부", "chapter": "제2장 과세가격과 관세의 부과ㆍ징수 등", "section": "제1관 세액의 확정", "paras": [{"l": 1, "t": "① 물품(제39조에 따라 세관장이 부과고지하는 물품은 제외한다)을 수입하려는 자는 수입신고를 할 때에 세관장에게 관세의 납부에 관한 신고(이하 “납세신고”라 한다)를 하여야 한다."}, {"l": 1, "t": "② 세관장은 납세신고를 받으면 수입신고서에 기재된 사항과 이 법에 따른 확인사항 등을 심사하되, 신고한 세액 등납세신고 내용에 대한 심사(이하 “세액심사”라 한다)는 수입신고를 수리한 후에 한다. 다만, 신고한 세액에 대하여관세채권을 확보하기가 곤란하거나, 수입신고를 수리한 후 세액심사를 하는 것이 적당하지 아니하다고 인정하여 재정경제부령으로 정하는 물품의 경우에는 수입신고를 수리하기 전에 이를 심사한다."}, {"l": 1, "t": "③ 세관장은 세액심사를 할 때 제1항에 따라 제출된 신고서나 그 밖의 서류에 미비한 점이 있거나 오류가 있는 경우에는 보완할 것을 요구할 수 있다."}, {"l": 1, "t": "④ 세관장은 제2항 본문에도 불구하고 납세실적과 수입규모 등을 고려하여 관세청장이 정하는 요건을 갖춘 자가 신청할 때에는 납세신고한 세액을 자체적으로 심사(이하 “자율심사”라 한다)하게 할 수 있다. 이 경우 해당 납세의무자는 자율심사한 결과를 세관장에게 제출하여야 한다."}, {"l": 1, "t": "⑤ 납세의무자는 납세신고한 세액을 납부하기 전에 그 세액이 과부족(過不足)하다는 것을 알게 되었을 때에는 납세신고한 세액을 정정할 수 있다. 이 경우 납부기한은 당초의 납부기한(제9조에 따른 납부기한을 말한다)으로 한다."}, {"l": 1, "t": "⑥ 납세신고, 자율심사 및 제5항에 따른 세액의 정정과 관련하여 그 방법 및 절차 등 필요한 사항은 대통령령으로정한다."}, {"l": 1, "t": "⑦ 관세의 납부에 관하여는 「국세징수법」 제12조제1항제3호, 같은 조 제2항 및 제3항을 준용한다."}], "deleg": ["령", "칙"]}, "decrees": [{"kind": "decree", "no": "32", "title": "납세신고", "chapter": "제2장 과세가격과 관세의 부과ㆍ징수 등", "section": "제5절 부과와 징수", "paras": [{"l": 1, "t": "①법 제38조제1항의 규정에 의하여 납세신고를 하고자 하는 자는 제246조의 규정에 의한 수입신고서에 동조 각호의 사항외에 다음 각호의 사항을 기재하여 세관장에게 제출하여야 한다."}, {"l": 2, "t": "1. 당해 물품의 관세율표상의 품목분류ㆍ세율과 품목분류마다 납부하여야 할 세액 및 그 합계액"}, {"l": 2, "t": "2. 법 기타 관세에 관한 법률 또는 조약에 의하여 관세의 감면을 받는 경우에는 그 감면액과 법적 근거"}, {"l": 2, "t": "3. 제23조제1항의 규정에 의한 특수관계에 해당하는지 여부와 그 내용"}, {"l": 2, "t": "4. 기타 과세가격결정에 참고가 되는 사항"}, {"l": 1, "t": "②관세청장은 법 제38조제2항의 규정에 의한 세액심사의 원활을 기하기 위하여 필요한 때에는 심사방법 등에 관한기준을 정할 수 있다."}], "deleg": [], "link": "위임", "rules": []}, {"kind": "decree", "no": "32의2", "title": "자율심사", "chapter": "제2장 과세가격과 관세의 부과ㆍ징수 등", "section": "제5절 부과와 징수", "paras": [{"l": 1, "t": "①세관장은 납세의무자가 법 제38조제4항의 규정에 따라 납세신고세액을 자체적으로 심사하고자신청하는 경우에는 관세청장이 정하는 절차에 의하여 자율심사를 하는 납세의무자(이하 “자율심사업체”라 한다)로 승인할 수 있다. 이 경우 세관장은 자율심사의 방법 및 일정 등에 대하여 자율심사업체와 사전협의할 수 있다."}, {"l": 1, "t": "②세관장은 자율심사업체에게 수출입업무의 처리방법 및 체계 등에 관한 관세청장이 정한 자료를 제공하여야 한다."}, {"l": 1, "t": "③자율심사업체는 제2항의 규정에 의하여 세관장이 제공한 자료에 따라 다음 각호의 사항을 기재한 자율심사결과및 조치내용을 세관장에게 제출하여야 한다. 이 경우 자율심사업체는 당해 결과를 제출하기 전에 납부세액의 과부족분에 대하여는 보정신청하거나 수정신고 또는 경정청구하여야 하며, 과다환급금이 있는 경우에는 세관장에게 통지하여야 한다."}, {"l": 2, "t": "1. 제2항의 규정에 의하여 세관장이 제공한 자료에 따라 작성한 심사결과"}, {"l": 2, "t": "2. 자율심사를 통하여 업무처리방법ㆍ체계 및 세액 등에 대한 보완이 필요한 것으로 확인된 사항에 대하여 조치한내용"}, {"l": 1, "t": "④세관장은 제3항의 규정에 의하여 제출된 결과를 평가하여 자율심사업체에 통지하여야 한다. 다만, 자율심사가 부적절하게 이루어진 것으로 판단되는 경우에는 추가적으로 필요한 자료의 제출을 요청하거나 방문하여 심사한 후에통지할 수 있다."}, {"l": 1, "t": "⑤세관장은 제4항 단서의 규정에 의한 자료의 요청 또는 방문심사한 결과에 따라 당해 자율심사업체로 하여금 자율심사를 적정하게 할 수 있도록 보완사항을 고지하고, 개선방법 및 일정 등에 대한 의견을 제출하게 하는 등 자율심사의 유지에 필요한 조치를 할 수 있다."}, {"l": 1, "t": "⑥세관장은 자율심사업체가 다음 각 호의 어느 하나에 해당하는 경우에는 자율심사의 승인을 취소할 수 있다."}, {"l": 2, "t": "1. 법 제38조제4항의 규정에 의한 관세청장이 정한 요건을 갖추지 못하게 되는 경우"}, {"l": 2, "t": "2. 자율심사를 하지 아니할 의사를 표시하는 경우"}, {"l": 2, "t": "3. 자율심사 결과의 제출 등 자율심사의 유지를 위하여 필요한 의무 등을 이행하지 아니하는 경우"}], "deleg": [], "link": "위임", "rules": []}, {"kind": "decree", "no": "32의3", "title": "세액의 정정", "chapter": "제2장 과세가격과 관세의 부과ㆍ징수 등", "section": "제5절 부과와 징수", "paras": [{"l": 0, "t": "법 제38조제5항의 규정에 의하여 세액을 정정하고자 하는 자는 당해 납세신고와 관련된 서류를 세관장으로부터 교부받아 과세표준 및 세액 등을 정정하고, 그 정정한 부분에 서명 또는 날인하여 세관장에게 제출하여야 한다."}], "deleg": [], "link": "위임", "rules": []}, {"kind": "decree", "no": "32의5", "title": "신용카드 등에 의한 관세 등의 납부", "chapter": "제2장 과세가격과 관세의 부과ㆍ징수 등", "section": "제5절 부과와 징수", "paras": [{"l": 1, "t": "① 법 제38조제7항에 따라 납세의무자가 신고하거나 세관장이 부과 또는 경정하여 고지한 세액(세관장이 관세와 함께 징수하는 내국세등의 세액을 포함한다)은 신용카드, 직불카드 등(이하 이 조에서 “신용카드등”이라 한다)으로 납부할 수 있다."}, {"l": 1, "t": "② 법 제38조제7항에 따라 준용되는 「국세징수법」 제12조제1항제3호 각 목 외의 부분에 따른 국세납부대행기관이란 정보통신망을 이용하여 신용카드등에 의한 결제를 수행하는 기관으로서 재정경제부령으로 정하는 바에 따라 관세납부를 대행하는 기관(이하 이 조에서 “관세납부대행기관”이라 한다)을 말한다."}, {"l": 1, "t": "③ 관세납부대행기관은 납세자로부터 신용카드등에 의한 관세납부대행용역의 대가로 재정경제부령으로 정하는 바에 따라 납부대행수수료를 받을 수 있다."}, {"l": 1, "t": "④ 관세청장은 납부에 사용되는 신용카드등의 종류, 그 밖에 관세납부에 필요한 사항을 정할 수 있다."}], "deleg": ["칙"], "link": "위임", "rules": [{"kind": "rule", "no": "8의2", "title": "신용카드 등에 의한 관세납부", "chapter": "", "section": "", "paras": [{"l": 1, "t": "① 영 제32조의5제2항에서 “재정경제부령으로 정하는 바에 따라 관세납부를 대행하는 기관”(이하 “관세납부대행기관”이라 한다)이란 다음 각 호의 어느 하나에 해당하는 자를 말한다."}, {"l": 2, "t": "1. 「민법」제32조 및 「금융위원회 소관 비영리법인의 설립 및 감독에 관한 규칙」에 따라 설립된 금융결제원"}, {"l": 2, "t": "2. 시설, 업무수행능력, 자본금 규모 등을 고려하여 관세청장이 관세납부대행기관으로 지정하는 자"}, {"l": 1, "t": "② 영 제32조의5제3항에 따른 납부대행수수료는 관세청장이 관세납부대행기관의 운영경비 등을 종합적으로 고려하여 승인하되, 해당 납부세액의 1천분의 10을 초과할 수 없다."}], "deleg": ["칙"], "link": "위임"}]}, {"kind": "decree", "no": "7", "title": "관세징수권 소멸시효의 기산일", "chapter": "제2장 과세가격과 관세의 부과ㆍ징수 등", "section": "제2절 납세의무의 소멸 등", "paras": [{"l": 1, "t": "①법 제22조제1항에 따른 관세징수권을 행사할 수 있는 날은 다음 각 호의 날로 한다."}, {"l": 2, "t": "1. 법 제38조에 따라 신고납부하는 관세에 있어서는 수입신고가 수리된 날부터 15일이 경과한 날의 다음날. 다만,제1조의5에 따른 월별납부의 경우에는 그 납부기한이 경과한 날의 다음 날로 한다."}, {"l": 2, "t": "1의2. 법 제38조의2제4항의 규정에 의하여 납부하는 관세에 있어서는 부족세액에 대한 보정신청일의 다음날의 다음날"}, {"l": 2, "t": "2. 법 제38조의3제1항의 규정에 의하여 납부하는 관세에 있어서는 수정신고일의 다음날의 다음날"}, {"l": 2, "t": "3. 법 제39조에 따라 부과고지하는 관세의 경우 납부고지를 받은 날부터 15일이 경과한 날의 다음 날"}, {"l": 2, "t": "4. 법 제253조제3항의 규정에 의하여 납부하는 관세에 있어서는 수입신고한 날부터 15일이 경과한 날의 다음날"}, {"l": 2, "t": "5. 그 밖의 법령에 따라 납부고지하여 부과하는 관세의 경우 납부기한을 정한 때에는 그 납부기한이 만료된 날의 다음 날"}, {"l": 1, "t": "②법 제22조제2항에 따른 관세환급청구권을 행사할 수 있는 날은 다음 각 호의 날로 한다.<개정 2004. 3. 29., 2010."}, {"l": 2, "t": "3. 26., 2012. 2. 2., 2017. 3. 27., 2018. 2. 13., 2022. 2. 15.>"}, {"l": 2, "t": "1. 법 제38조의3제6항에 따른 경정으로 인한 환급의 경우에는 경정결정일"}, {"l": 2, "t": "2. 착오납부 또는 이중납부로 인한 환급의 경우에는 그 납부일"}, {"l": 2, "t": "3. 법 제106조제1항에 따른 계약과 상이한 물품 등에 대한 환급의 경우에는 당해 물품의 수출신고수리일 또는 보세공장반입신고일"}, {"l": 2, "t": "3의2. 법 제106조제3항 및 제4항에 따른 폐기, 멸실, 변질, 또는 손상된 물품에 대한 환급의 경우에는 해당 물품이폐기, 멸실, 변질 또는 손상된 날"}, {"l": 2, "t": "3의3. 법 제106조의2제1항에 따른 수입한 상태 그대로 수출되는 자가사용물품에 대한 환급의 경우에는 수출신고가수리된 날. 다만, 수출신고가 생략되는 물품의 경우에는 운송수단에 적재된 날로 한다."}, {"l": 2, "t": "3의4. 법 제106조의2제2항에 따라 국제무역선, 국제무역기 또는 보세판매장에서 구입한 후 환불한 물품에 대한 환급의 경우에는 해당 물품이 환불된 날"}, {"l": 2, "t": "3의5. 종합보세구역에서 물품을 판매하는 자가 법 제199조의2 및 이 영 제216조의5제2항의 규정에 의하여 환급받고자 하는 경우에는 동규정에 의한 환급에 필요한 서류의 제출일"}, {"l": 2, "t": "4. 수입신고 또는 입항전수입신고를 하고 관세를 납부한 후 법 제250조의 규정에 의하여 신고가 취하 또는 각하된경우에는 신고의 취하일 또는 각하일"}, {"l": 2, "t": "5. 적법하게 납부한 후 법률의 개정으로 인하여 환급하는 경우에는 그 법률의 시행일 제8조 삭제"}], "deleg": [], "link": "인용", "rules": []}, {"kind": "decree", "no": "138", "title": "납세자의 성실성 추정 등의 배제사유", "chapter": "제5장 납세자의 권리 및 불복절차", "section": "제1절 납세자의 권리", "paras": [{"l": 1, "t": "①법 제113조제1항에서 “대통령령으로 정하는 경우”란 다음 각 호의 어느 하나에 해당하는 경우를 말한다."}, {"l": 2, "t": "1. 납세자가 법에서 정하는 신고 및 신청, 과세자료의 제출 등의 납세협력의무를 이행하지 아니한 경우"}, {"l": 2, "t": "2. 납세자에 대한 구체적인 탈세정보가 있는 경우"}, {"l": 2, "t": "3. 신고내용에 탈루나 오류의 혐의를 인정할 만한 명백한 자료가 있는 경우"}, {"l": 2, "t": "4. 납세자의 신고내용이 관세청장이 정한 기준과 비교하여 불성실하다고 인정되는 경우"}, {"l": 1, "t": "②법 제113조제2항에서 “대통령령으로 정하는 행위”란 다음 각 호의 어느 하나에 해당하는 것을말한다."}, {"l": 2, "t": "1. 법 제38조제2항에 따른 세액심사를 위한 질문이나 자료제출의 요구"}, {"l": 2, "t": "2. 법 제246조에 따른 물품의 검사"}, {"l": 2, "t": "3. 법 제266조제1항에 따른 장부 또는 자료의 제출"}, {"l": 2, "t": "4. 그 밖의 법(「수출용원재료에 대한 관세 등 환급에 관한 특례법」을 포함한다)에 따른 자료조사나 자료제출의 요구"}], "deleg": ["령"], "link": "인용", "rules": []}], "rules_direct": [{"kind": "rule", "no": "8", "title": "수입신고수리전 세액심사 대상물품", "chapter": "", "section": "", "paras": [{"l": 1, "t": "①법 제38조제2항 단서의 규정에 의하여 수입신고수리전에 세액심사를 하는 물품은 다음 각호와 같다."}, {"l": 2, "t": "1. 법률 또는 조약에 의하여 관세 또는 내국세를 감면받고자 하는 물품"}, {"l": 2, "t": "2. 법 제107조의 규정에 의하여 관세를 분할납부하고자 하는 물품"}, {"l": 2, "t": "3. 관세를 체납하고 있는 자가 신고하는 물품(체납액이 10만원 미만이거나 체납기간 7일 이내에 수입신고하는 경우를 제외한다)"}, {"l": 2, "t": "4. 납세자의 성실성 등을 참작하여 관세청장이 정하는 기준에 해당하는 불성실신고인이 신고하는 물품"}, {"l": 2, "t": "5. 물품의 가격변동이 큰 물품 기타 수입신고수리후에 세액을 심사하는 것이 적합하지 아니하다고 인정하여 관세청장이 정하는 물품"}, {"l": 1, "t": "②제1항의 규정에 의하여 수입신고수리전에 세액심사를 하는 물품중 제1항제1호 및 제2호에 규정된 물품의 감면또는 분할납부의 적정 여부에 대한 심사는 수입신고수리전에 하고, 과세가격 및 세율 등에 대한 심사는 수입신고수리후에 한다."}], "deleg": [], "link": "위임"}]}, {"law": {"kind": "law", "no": "97", "title": "재수출면세", "chapter": "제4장 감면ㆍ환급 및 분할납부 등", "section": "제1절 감면", "paras": [{"l": 1, "t": "① 수입신고 수리일부터 다음 각 호의 어느 하나의 기간에 다시 수출하는 물품에 대하여는 그 관세를 면제할 수 있다."}, {"l": 2, "t": "1. 재정경제부령으로 정하는 물품: 1년의 범위에서 대통령령으로 정하는 기준에 따라 세관장이 정하는 기간. 다만,세관장은 부득이한 사유가 있다고 인정될 때에는 1년의 범위에서 그 기간을 연장할 수 있다."}, {"l": 2, "t": "2. 1년을 초과하여 수출하여야 할 부득이한 사유가 있는 물품으로서 재정경제부령으로 정하는 물품: 세관장이 정하는 기간"}, {"l": 1, "t": "② 제1항에 따라 관세를 면제받은 물품은 같은 항의 기간에 같은 항에서 정한 용도 외의 다른 용도로 사용되거나양도될 수 없다. 다만, 대통령령으로 정하는 바에 따라 미리 세관장의 승인을 받았을 때에는 그러하지 아니하다."}, {"l": 1, "t": "③ 다음 각 호의 어느 하나에 해당하는 경우에는 수출하지 아니한 자, 용도 외로 사용한 자 또는 양도를 한 자로부터 면제된 관세를 즉시 징수하며, 양도인으로부터 해당 관세를 징수할 수 없을 때에는 양수인으로부터 면제된 관세를 즉시 징수한다. 다만, 재해나 그 밖의 부득이한 사유로 멸실되었거나 미리 세관장의 승인을 받아 폐기하였을 때에는 그러하지 아니하다."}, {"l": 2, "t": "1. 제1항에 따라 관세를 면제받은 물품을 같은 항에 규정된 기간 내에 수출하지 아니한 경우"}, {"l": 2, "t": "2. 제1항에서 정한 용도 외의 다른 용도로 사용하거나 해당 용도 외의 다른 용도로 사용하려는 자에게 양도한 경우"}, {"l": 1, "t": "④ 세관장은 제1항에 따라 관세를 면제받은 물품 중 재정경제부령으로 정하는 물품이 같은 항에 규정된 기간 내에수출되지 아니한 경우에는 500만원을 넘지 아니하는 범위에서 해당 물품에 부과될 관세의 100분의 20에 상당하는금액을 가산세로 징수한다."}], "deleg": ["령", "칙"]}, "decrees": [{"kind": "decree", "no": "109", "title": "감면물품의 용도외사용 등에 대한 승인신청", "chapter": "제4장 감면ㆍ환급 및 분할납부 등", "section": "제1절 감면", "paras": [{"l": 1, "t": "①법 제83조제2항 단서ㆍ법 제88조제2항 단서ㆍ법 제97조제2항 단서(법 제98조제2항에서 준용하는 경우를 포함한다) 또는 법 제102조제1항 단서에 의하여 세관장의 승인을 얻고자 하는 자는 다음 각호의 사항을 기재한 신청서를 당해물품의 소재지를 관할하는 세관장(이하 “관할지세관장”이라 한다)에게 제출하여야 한다. 다만, 법제97조제2항 단서(법 제98조제2항에서 준용하는 경우를 포함한다)의 규정에 해당하는 경우에는 당해 물품을 최초에 수입신고한 세관에서도 할 수 있다."}, {"l": 2, "t": "1. 당해 물품의 품명ㆍ규격ㆍ수량ㆍ관세감면액 또는 적용된 용도세율ㆍ수입신고수리 연월일 및수입신고번호"}, {"l": 2, "t": "2. 당해 물품의 통관세관명"}, {"l": 2, "t": "3. 승인신청이유"}, {"l": 2, "t": "4. 당해 물품의 양수인의 사업의 종류, 주소ㆍ상호 및 성명(법인인 경우에는 대표자의 성명)"}, {"l": 1, "t": "②재해 기타 부득이한 사유로 인하여 멸실된 물품에 대하여 법 제83조제3항 단서ㆍ법 제97조제3항 단서(법 제98조제2항에서 준용하는 경우를 포함한다)ㆍ법 제102조제2항 단서 또는 법 제109조제2항 단서의 규정을 적용받고자 하는 자는 멸실 후 지체없이 다음의 사항을 기재한 신청서에 그 사실을 증빙할 수 있는 서류를 첨부하여 세관장에게 제출하여야 한다."}, {"l": 2, "t": "1. 멸실된 물품의 품명ㆍ규격ㆍ수량ㆍ수입신고수리 연월일 및 수입신고번호"}, {"l": 2, "t": "2. 멸실연월일 및 멸실장소"}, {"l": 2, "t": "3. 멸실된 물품의 통관세관명"}, {"l": 1, "t": "③법 제83조제3항 단서ㆍ법 제97조제3항 단서(법 제98조제2항에서 준용하는 경우를 포함한다)ㆍ법 제102조제2항 단서 또는 법 제109조제2항 단서의 규정에 의하여 물품폐기에 대한 세관장의 승인을 얻고자 하는 자는 다음의 사항을 기재한 신청서를 세관장에게 제출하여야 한다."}, {"l": 2, "t": "1. 당해 물품의 품명ㆍ규격ㆍ수량ㆍ수입신고수리 연월일 및 수입신고번호"}, {"l": 2, "t": "2. 당해 물품의 통관세관명"}, {"l": 2, "t": "3. 폐기의 사유ㆍ방법 및 장소와 폐기예정연월일"}], "deleg": [], "link": "위임", "rules": []}, {"kind": "decree", "no": "114", "title": "재수출기간의 연장신청", "chapter": "제4장 감면ㆍ환급 및 분할납부 등", "section": "제1절 감면", "paras": [{"l": 0, "t": "법 제97조제1항제1호 단서의 규정에 의하여 수출기간을 연장받고자 하는 자는 당해 물품의 수입신고수리 연월일ㆍ신고번호ㆍ품명ㆍ규격 및 수량, 연장기간과 연장사유를 기재한 신청서를 당해 물품의 수입지세관장에게 제출하여야 한다. 다만, 관세청장이 정한 물품에 대하여는 수입지세관외의 세관에서도 재수출기간의 연장승인을 할 수 있다."}], "deleg": [], "link": "위임", "rules": []}, {"kind": "decree", "no": "115", "title": "재수출면세기간", "chapter": "제4장 감면ㆍ환급 및 분할납부 등", "section": "제1절 감면", "paras": [{"l": 1, "t": "①세관장은 법 제97조제1항의 규정에 의하여 재수출면세기간을 정하고자 하는 때에는 다음 각 호의 기간을 재수출면세기간으로 한다. 이 경우 재수출면세물품이 행정 당국에 의하여 압류된 경우에는 해당 압류기간은 재수출면세 기간에 산입하지 않는다."}, {"l": 2, "t": "1. 일시 입국하는 자가 본인이 사용하고 재수출할 목적으로 직접 휴대하여 수입하거나 별도로수입하는 신변용품ㆍ취재용품 및 이와 유사한 물품의 경우에는 입국후 처음 출국하는 날까지의 기간"}, {"l": 2, "t": "2. 박람회ㆍ전시회ㆍ품평회 기타 이에 준하는 행사에 출품 또는 사용하기 위하여 수입하는 물품은 박람회 등의 행사기간종료일에 당해 물품을 재수출하는데 필요한 기일을 더한 기간"}, {"l": 2, "t": "3. 수리를 위한 물품 및 그 재료는 수리에 소요되는 것으로 인정되는 기간"}, {"l": 2, "t": "4. 기타의 물품은 당해 물품의 반입계약에 관한 증빙서류에 의하여 확인되는 기간으로 하되, 반입계약에 관한 증빙서류에 의하여 확인할 수 없는 때에는 당해 물품의 성질ㆍ용도ㆍ수입자ㆍ내용연수 등을 고려하여 세관장이 정하는 기간"}, {"l": 1, "t": "②세관장은 법 제98조제1항의 규정에 의하여 4년의 범위내에서 재수출 기간을 정하고자 하는때에는 당해 물품의 반입계약에 관한 증빙서류에 의하여 확인되는 기간을 기준으로 하여야 한다. 다만, 그 증빙서류에 의하여 확인되는 기간을 기준으로 하기가 적당하지 아니하거나 증빙서류에 의하여 확인할 수 없는 때에는 당해 감면물품의 성질ㆍ용도ㆍ임대차기간 또는 도급기간 등을고려하여 타당하다고 인정되는 기간을 기준으로 할 수 있다."}], "deleg": [], "link": "위임", "rules": []}, {"kind": "decree", "no": "116", "title": "재수출조건 감면물품의 수출 및 가산세징수", "chapter": "제4장 감면ㆍ환급 및 분할납부 등", "section": "제1절 감면", "paras": [{"l": 1, "t": "①법 제97조제1항 또는 법 제98조제1항의 규정에 의하여 관세의 감면을 받은 물품을 당해 기간내에 수출하고자 하는 자는 수출신고시에 당해물품의 수입신고필증 또는 이에 대신할 세관의 증명서와 기타 참고서류를 제출하여야 한다."}, {"l": 1, "t": "②세관장은 제1항의 물품이 수출된 때에는 세관에 제출된 수입신고필증 또는 이에 대신할 세관의 증명서에 수출된 사실을 기재하여 수출신고인에게 교부하여야 한다."}, {"l": 1, "t": "③ 삭제 제117조 삭제"}], "deleg": ["고시"], "link": "위임", "rules": []}, {"kind": "decree", "no": "130", "title": "사후관리 대상물품의 이관 및 관세의 징수", "chapter": "제4장 감면ㆍ환급 및 분할납부 등", "section": "제2절 환급 및 분할납부 등", "paras": [{"l": 1, "t": "①법 제83조, 제89조제1항제2호, 제90조, 제91조, 제93조, 제95조제1항제1호부터 제3호까지, 제98조 및 제107조에 따라 용도세율의 적용, 관세의 감면 또는 분할납부의 승인을 받은 물품의 통관세관과 관할지세관이 서로 다른 경우에는 통관세관장은 관세청장이 정하는 바에 따라 관할지세관장에게 해당 물품에 대한 관계서류를 인계 하여야 한다."}, {"l": 1, "t": "②제1항의 규정에 의하여 통관세관장이 관할지세관장에게 관계서류를 인계한 물품에 대하여 법제97조제3항(법 제98조제2항에서 준용하는 경우를 포함한다) 및 법 제102조제2항의 규정에 의하여 징수하는 관세는 관할지세관장이 이를 징수한다."}], "deleg": [], "link": "인용", "rules": []}, {"kind": "decree", "no": "131", "title": "담보제공의 신고 등", "chapter": "제4장 감면ㆍ환급 및 분할납부 등", "section": "제2절 환급 및 분할납부 등", "paras": [{"l": 1, "t": "①법 제108조제1항의 규정에 의한 담보의 제공여부는 물품의 성질및 종류, 관세채권의 확보가능성 등을 기준으로 하여 정하되, 다음 각 호의 어느 하나에 해당하는 경우에 한하여야 한다."}, {"l": 2, "t": "1. 법 제97조 또는 법 제98조의 규정에 의하여 관세를 감면받은 경우"}, {"l": 2, "t": "2. 법 제107조의 규정에 의하여 분할납부승인을 받은 경우"}, {"l": 1, "t": "②법 제108조제1항에 따라 세관장은 수입신고를 수리하는 때까지 담보를 제공하게 할 수 있다.다만, 긴급한 사유로 법 제8조제3항 각 호에 해당하는 날 등 금융기관이 업무를 수행할 수 없는날에 수입하는 물품으로서 긴급성의 정도 등을 고려하여 관세청장이 정하여 고시하는 물품에 대하여는 수입신고를 수리하는 때 이후 최초로 금융기관이 업무를 수행하는 날까지 담보를 제공하게 할 수 있다."}], "deleg": ["고시"], "link": "인용", "rules": []}], "rules_direct": [{"kind": "rule", "no": "50", "title": "재수출면세대상물품 및 가산세징수대상물품", "chapter": "", "section": "", "paras": [{"l": 1, "t": "①법 제97조제1항제1호에 따라 관세가 면제되는 물품과 같은 조 제4항에 따라 가산세가 징수되는 물품은 다음 각 호와 같다. <개정 2002. 5. 10., 2003. 2. 14., 2004. 3. 30., 2005. 2. 11., 2007. 5. 29., 2007. 12. 31., 2009. 3. 26., 2012. 2. 28., 2013. 2. 23., 2016. 3. 9., 2016. 12. 30., 2021. 3. 16., 2021."}, {"l": 2, "t": "10. 28., 2023. 12. 29., 2025. 3. 21.>"}, {"l": 2, "t": "1. 수입물품의 포장용품. 다만, 관세청장이 지정하는 물품을 제외한다."}, {"l": 2, "t": "2. 수출물품의 포장용품. 다만, 관세청장이 지정하는 물품을 제외한다."}, {"l": 2, "t": "3. 우리나라에 일시입국하는 자가 본인이 사용하고 재수출할 목적으로 몸에 직접 착용 또는 휴대하여 반입하거나별도로 반입하는 물품. 다만, 관세청장이 지정하는 물품을 제외한다."}, {"l": 2, "t": "4. 우리나라에 일시입국하는 자가 본인이 사용하고  재수출할 목적으로 직접 휴대하여 반입하거나 별도로 반입하는직업용품 및 「신문 등의 진흥에 관한 법률」 제28조에 따라 지사 또는 지국의 설치등록을 한 자가 취재용으로 반입하는 방송용의 녹화되지 아니한 비디오테이프"}, {"l": 2, "t": "5. 관세청장이 정하는 시설에서 국제해운에 종사하는 외국선박의 승무원의 후생을 위하여 반입하는 물품과 그 승무원이 숙박기간중 당해 시설에서 사용하기 위하여 선박에서 하역된 물품"}, {"l": 2, "t": "6. 박람회ㆍ전시회ㆍ공진회ㆍ품평회나 그 밖에 이에 준하는 행사에 출품 또는 사용하기 위하여 그 주최자 또는 행사에 참가하는 자가 수입하는 물품 중 해당 행사의 성격ㆍ규모 등을 고려하여 세관장이 타당하다고 인정하는 물품"}, {"l": 2, "t": "7. 국제적인 회의ㆍ회합 등에서 사용하기 위한 물품"}, {"l": 2, "t": "8. 법 제90조제1항제2호에 따른 기관 및 「국방과학연구소법」에 따른 국방과학연구소에서 학술연구 및 교육훈련을목적으로 사용하기 위한 학술연구용품"}, {"l": 2, "t": "9. 법 제90조제1항제2호에 따른 기관 및 「국방과학연구소법」에 따른 국방과학연구소에서 과학기술연구 및 교육훈련을 위한 과학장비용품"}, {"l": 2, "t": "10. 주문수집을 위한 물품, 시험용 물품 및 제작용 견본품"}, {"l": 2, "t": "11. 수리를 위한 물품[수리를 위하여 수입되는 물품과 수리 후 수출하는 물품이 영 제98조제1항에 따른 관세ㆍ통계통합품목분류표(이하 “품목분류표”라 한다)상 10단위의 품목번호가 일치할 것으로 인정되는 물품만 해당한다]"}, {"l": 2, "t": "12. 수출물품 및 수입물품의 검사 또는 시험을 위한 기계ㆍ기구"}, {"l": 2, "t": "13. 일시입국자가 입국할 때에 수송하여 온 본인이 사용할 승용자동차ㆍ이륜자동차ㆍ캠핑카ㆍ캬라반ㆍ트레일러ㆍ선박 및 항공기와 관세청장이 정하는 그 부분품 및 예비품"}, {"l": 2, "t": "14. 관세청장이 정하는 수출입물품ㆍ반송물품 및 환적물품을 운송하기 위한 차량"}, {"l": 2, "t": "15. 이미 수입된 국제운송을 위한 컨테이너의 수리를 위한 부분품"}, {"l": 2, "t": "16. 수출인쇄물 제작원고용 필름(빛에 노출되어 현상된 것에 한한다)"}, {"l": 2, "t": "17. 광메모리매체 제조용으로 정보가 수록된 마스터테이프 및 니켈판(생산제품을 수출할 목적으로 수입되는 것임을당해 업무를 관장하는 중앙행정기관의 장이 확인한 것에 한한다)"}, {"l": 2, "t": "18. 항공기 및 그 부분품의 수리ㆍ검사 또는 시험을 위한 기계ㆍ기구"}, {"l": 2, "t": "19. 항공 및 해상화물운송용 파렛트"}, {"l": 2, "t": "20. 수출물품 규격확인용 물품"}, {"l": 2, "t": "21. 항공기의 수리를 위하여 일시 사용되는 엔진 및 부분품"}, {"l": 2, "t": "22. 산업기계의 수리용 또는 정비용의 것으로서 무상으로 수입되는 기계 또는 장비"}, {"l": 2, "t": "23. 외국인투자기업이 자체상표제품을 생산하기 위하여 일시적으로 수입하는 금형 및 그 부분품"}, {"l": 2, "t": "24. 반도체 제조설비 또는 디스플레이 제조설비와 함께 수입되는 물품으로서 다음 각 목의 어느 하나에 해당하는물품"}, {"l": 3, "t": "가. 반도체 제조설비 또는 디스플레이 제조설비 운반용구"}, {"l": 3, "t": "나. 반도체 제조설비 또는 디스플레이 제조설비의 운송과정에서 해당 설비의 품질을 유지하거나 상태를 측정ㆍ기록하기 위해 해당 설비에 부착하는 기기"}, {"l": 1, "t": "②법 제97조제1항제2호에 따라 관세가 면제되는 물품과 같은 조 제4항에 따라 가산세가 징수되는 물품은 다음 각호와 같다."}, {"l": 2, "t": "1. 수송기기의 하자를 보수하거나 이를 유지하기 위한 부분품"}, {"l": 2, "t": "2. 외국인 여행자가 연 1회 이상 항해조건으로 반입한 후 지방자치단체에서 보관ㆍ관리하는 요트(모터보트를 포함한다)"}], "deleg": [], "link": "위임"}, {"kind": "rule", "no": "51", "title": "재수출물품에 대한 관세의 감면신청", "chapter": "", "section": "", "paras": [{"l": 0, "t": "법 제97조제1항의 규정에 의하여 관세를 감면받고자 하는 자는 영 제112조제1항 각호의 사항외에 당해 물품의 수출예정시기ㆍ수출지 및 수출예정세관명을 신청서에 기재하여야 한다."}], "deleg": [], "link": "위임"}]}, {"law": {"kind": "law", "no": "100", "title": "손상물품에 대한 감면", "chapter": "제4장 감면ㆍ환급 및 분할납부 등", "section": "제1절 감면", "paras": [{"l": 1, "t": "① 수입신고한 물품이 수입신고가 수리되기 전에 변질되거나 손상되었을 때에는 대통령령으로 정하는 바에 따라 그 관세를 경감할 수 있다."}, {"l": 1, "t": "② 이 법이나 그 밖의 법률 또는 조약ㆍ협정 등에 따라 관세를 감면받은 물품에 대하여 관세를 추징하는 경우 그 물품이 변질 또는 손상되거나 사용되어 그 가치가 떨어졌을 때에는 대통령령으로 정하는 바에 따라 그 관세를 경감할수 있다."}], "deleg": ["령"]}, "decrees": [{"kind": "decree", "no": "118", "title": "변질ㆍ손상 등의 관세경감액", "chapter": "제4장 감면ㆍ환급 및 분할납부 등", "section": "제1절 감면", "paras": [{"l": 1, "t": "①법 제100조의 규정에 의하여 경감하는 관세액은 다음 각 호의 관세액중 많은 금액으로 한다."}, {"l": 2, "t": "1. 수입물품의 변질ㆍ손상 또는 사용으로 인한 가치의 감소에 따르는 가격의 저하분에 상응하는관세액"}, {"l": 2, "t": "2. 수입물품의 관세액에서 그 변질ㆍ손상 또는 사용으로 인한 가치의 감소후의 성질 및 수량에의하여 산출한 관세액을 공제한 차액"}, {"l": 1, "t": "②제1항의 변질ㆍ손상 또는 사용으로 인한 가치감소의 산정기준은 재정경제부령으로 정할 수있다."}], "deleg": ["칙"], "link": "위임", "rules": [{"kind": "rule", "no": "55의2", "title": "가치감소 const META = {"basis": "관세법 2026.10.2 시행 · 시행령 2026.7.1 시행 · 시행규칙 2026.7.31 시행", "sources": ["출처: 국가법령정보센터 PDF (관세법 제21490호 / 시행령 제36140호 / 시행규칙 제42호)", "※ 학습·정리용 초안입니다. 연계(위임/인용) 분류는 본문 인용 패턴으로 자동 추출한 결과이므로 최종 확인은 원문으로 하세요."]};
const KIND = {law:{label:'법',full:'관세법'}, decree:{label:'령',full:'시행령'}, rule:{label:'칙',full:'시행규칙'}};

let cur = 0, idSeq = 0;

$('#basis').textContent = META.basis;

function fmt(text, c, idx){
  const re = /(대통령령으로 정(?:하는|한다|하여|하고)|(?:재정경제부|기획재정부)령으로 정(?:하는|한다|하여)|관세청장이 (?:정하여 )?고시(?:하는|한다)?|고시)|((?:법|영)\s?)?제(\d+)조(?:의(\d+))?((?:제\d+항)?(?:제\d+호)?)/g;
  return esc(text).replace(re, (m, deleg, pre, n, sub, tail) => {
    if (deleg) return '<mark class="d">'+deleg+'</mark>';
    const no = n + (sub ? '의'+sub : '');
    const p = (pre||'').trim();
    let kind = c.kind === 'law' ? 'law' : (p === '영' ? 'decree' : (p === '법' ? 'law' : c.kind));
    if (c.kind === 'decree' && !p) kind = 'decree';
    const tgt = idx[kind+'-'+no];
    const hit = (p === '법' && kind === 'law' && no === DATA[cur].law.no);
    return '<span class="ref'+(tgt?' go':'')+(hit?' hit':'')+'"'+(tgt?' data-t="'+tgt+'"':'')+'>'+m+'</span>';
  });
}

function card(c, idx, opt={}){

  if (c.deleg.includes('칙')) tags.push('<span class="tag">칙에 위임</span>');
  if (c.deleg.includes('고시')) tags.push('<span class="tag k">고시 포함</span>');
  const loc = [c.chapter, c.section].filter(Boolean).join(' › ');
  return '<article class="card '+c.kind+(c.link==='인용'?' ref-only':'')+'" id="'+id+'">'+
    '<div class="ch"><span class="badge">'+KIND[c.kind].label+' 제'+c.no+'조</span>'+
    '<div class="ttl">'+esc(c.title)+'<small>'+KIND[c.kind].full+(loc?' · '+esc(loc):'')+'</small>'+
    (tags.length?'<div class="tags">'+tags.join('')+'</div>':'')+'</div></div>'+
    '<div class="cb'+(long?' clamp':'')+'">'+body+'</div>'+
    (long?'<button class="more">전문 보기 ▾</button>':'')+'</article>';
}

function render(i){
  cur = i; idSeq = 0;
  const c = DATA[i], idx = {};
  const main = $('#main');
  const dMain = c.decrees.filter(d => d.link === '위임');
  const dRef  = c.decrees.filter(d => d.link !== '위임');
  const hasGos = [c.law, ...c.decrees, ...c.decrees.flatMap(d=>d.rules), ...c.rules_direct].some(x => x.deleg.includes('고시'));
  const nRules = c.decrees.reduce((a,d)=>a+d.rules.length,0) + c.rules_direct.length;

  // 요약 한 줄
  let sum = '<div class="flow-row"><span class="pill law">법 제'+c.law.no+'조</span>';
  sum += '<span class="arrow">→</span>';
  sum += dMain.length ? dMain.map(d=>'<span class="pill decree">령 제'+d.no+'조</span>').join('') : '<span class="pill gos">령 위임 없음</span>';
  if (nRules){ sum += '<span class="arrow">→</span>' + [...dMain.flatMap(d=>d.rules), ...c.rules_direct].map(r=>'<span class="pill rule">칙 제'+r.no+'조</span>').join(''); }
  if (hasGos){ sum += '<span class="arrow">→</span><span class="pill gos">고시</span>'; }
  sum += '</div>';

  // 카드(법 먼저 만들어 idx 확보)
  const lawHTML = card(c.law, idx);
  let groups = '';
  const mkGroup = (d) => {
    const dh = card(d, idx);
    const rs = d.rules.map(r => card(r, idx)).join('') || '<div class="empty">연결된 시행규칙 조문 없음</div>';
    return '<div class="grp'+(d.rules.length?' has-r':'')+'"><div class="cell d">'+dh+'</div><div class="cell r">'+rs+'</div></div>';
  };
  dMain.forEach(d => groups += mkGroup(d));
  if (c.rules_direct.length){
    groups += '<div class="grp has-r"><div class="cell d"><div class="empty">법 → 시행규칙 <b>직접</b> 위임<br><small>시행령을 거치지 않고 법에서 바로 부령(시행규칙)으로 위임</small></div></div><div class="cell r">'+
      c.rules_direct.map(r=>card(r, idx)).join('')+'</div></div>';
  }
  if (!dMain.length && !c.rules_direct.length){
    groups += '<div class="empty">이 조문을 직접 위임 근거로 삼는 시행령·시행규칙 조문이 없습니다.</div>';
  }
  if (hasGos){
    groups += '<div class="grp"><div class="cell d"><div class="empty k"><b>고시</b> — 위 조문에 “관세청장이 정하여 고시” 위임이 포함되어 있습니다.<br><small>고시 원문은 아직 적재 전입니다(BACKDATA에 고시 PDF 추가 시 연동).</small></div></div></div>';
  }
  if (dRef.length){
    groups += '<details class="ref-list"><summary>단순 인용 조문 '+dRef.length+'건 (위임 근거는 아니지만 이 조문을 언급)</summary>'+
      dRef.map(d => '<div class="grp"><div class="cell d">'+card(d, idx)+'</div><div class="cell r">'+d.rules.map(r=>card(r, idx)).join('')+'</div></div>').join('')+'</details>';
  }

  main.innerHTML =
    '<div class="legend"><span class="lg"><i style="background:var(--law)"></i>법(관세법)</span><span class="lg"><i style="background:var(--dec)"></i>령(시행령)</span><span class="lg"><i style="background:var(--rul)"></i>칙(시행규칙)</span><span class="lg"><i style="background:var(--gos)"></i>고시</span><span class="lg"><mark class="d">위임 문구</mark></span></div>'+
    '<div class="summary"><b>연계 흐름</b>'+sum+'</div>'+
    '<div class="notice">연계는 하위 법령 본문에서 “법 제○조 / 영 제○조”를 인용한 지점을 자동 추출해 <b>위임</b>(근거 조문으로 직접 인용) / <b>인용</b>(단순 언급)으로 분류한 초안입니다.</div>'+
    '<div class="flow"><div class="law-col">'+lawHTML+'</div><div><div class="colhead"><div>시행령</div><div>시행규칙</div></div>'+groups+'</div></div>'+
    '<div class="foot">'+META.sources.map(esc).join('<br>')+'</div>';
  document.querySelectorAll('.chip').forEach((b,k)=>b.setAttribute('aria-selected', k===i));
  history.replaceState(null,'','#'+c.law.no);
}

document.addEventListener('click', e => {
  const t = e.target;
  if (t.matches('.more')){
    const cb = t.previousElementSibling; const open = cb.classList.toggle('clamp');
    t.textContent = open ? '전문 보기 ▾' : '접기 ▴'; return;
  }
  if (document.body.classList.contains('quiz') && (t.matches('mark.d') || t.matches('.ref.hit'))){ t.classList.toggle('open'); return; }
  const g = t.closest('.ref.go');
  if (g){ const el = document.getElementById(g.dataset.t); if (el){ const cb = el.querySelector('.cb.clamp'); if (cb){cb.classList.remove('clamp'); const m=el.querySelector('.more'); if(m) m.textContent='접기 ▴';}
      el.scrollIntoView({behavior:'smooth',block:'center'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); } }
});

// 상단 칩
const chips = $('#chips');
DATA.forEach((c,i) => {
  const b = document.createElement('button'); b.className='chip'; b.role='tab';
  b.textContent = '법 제'+c.law.no+'조 '+c.law.title.replace(/\s*등(?:으로 인한|에).*$/,'').slice(0,12);
  b.onclick = () => { render(i); window.scrollTo({top:0}); };
  chips.appendChild(b);
});
// 도구
let fs = +(localStorage.getItem('law_fs')||15);
const setFs = v => { fs = Math.min(21, Math.max(12, v)); document.documentElement.style.setProperty('--fs', fs+'px'); try{localStorage.setItem('law_fs', fs)}catch(e){} };
setFs(fs);
$('#fPlus').onclick = () => setFs(fs+1); $('#fMinus').onclick = () => setFs(fs-1);
$('#quizBtn').onclick = e => { const on = document.body.classList.toggle('quiz'); e.currentTarget.setAttribute('aria-pressed', on);
  document.querySelectorAll('.open').forEach(x=>x.classList.remove('open')); };

const h = location.hash.slice(1); const start = DATA.findIndex(c => c.law.no === decodeURIComponent(h));
render(start >= 0 ? start : 0);
</script>
</body>
</html>
